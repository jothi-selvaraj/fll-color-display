<!DOCTYPE html>
<html>

<head>
    <title>FLL Color Sensor Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            height:100vh;
            overflow:hidden;
            background:#f5f5f5;
        }

        .container{
            display:flex;
            height:100vh;
        }

        .left-panel{
            width:50%;
            background:white;
            padding:30px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:flex-start;
        }

        .right-panel{
            width:50%;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            transition:0.5s;
        }

        .logo{
            width:250px;
            margin-bottom:20px;
        }

        .team-title{
            font-size:36px;
            font-weight:bold;
            color:#222;
            margin-bottom:25px;
            text-align:center;
        }

        .team-photo{
            width:90%;
            max-height:500px;
            object-fit:cover;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,.2);
        }

        .project{
            margin-top:20px;
            text-align:center;
            font-size:20px;
            color:#555;
            max-width:700px;
        }

        #colorName{
            font-size:120px;
            font-weight:bold;
            color:white;
            text-shadow:2px 2px 10px rgba(0,0,0,.4);
        }

        #timestamp{
            margin-top:30px;
            font-size:32px;
            color:white;
        }

        .status{
            margin-top:20px;
            font-size:28px;
            color:white;
        }

    </style>

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue
        }
        from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

        
 const firebaseConfig = {
  apiKey: "AIzaSyDOo74IoJTMqIN3SrxCy84DQqAQQUFFv8U",
  authDomain: "fll-color-display.firebaseapp.com",
  projectId: "fll-color-display",
  storageBucket: "fll-color-display.firebasestorage.app",
  messagingSenderId: "403048053250",
  appId: "1:403048053250:web:fb4f45485c7af6fb2bc51b",
  measurementId: "G-SD05RLLECS"
};


        const app = initializeApp(firebaseConfig);

        const db = getDatabase(app);

        onValue(ref(db,"sensor"),(snapshot)=>{

            const data = snapshot.val();

            if(!data) return;

            let color = (data.color || "WHITE");

            document.getElementById("colorName")
                .innerText = color;

            document.getElementById("timestamp")
                .innerText = "Last Updated: "
                + (data.timestamp || "--");

            document.getElementById("liveColor")
                .style.backgroundColor =
                color.toLowerCase();

        });

    </script>

</head>

<body>

<div class="container">

    <div class="left-panel">

        <img src="logo.jpeg"
             class="logo">

        <div class="team-title">
            BOOVI AZEEN<br>
            ECO ENGINEERS
        </div>

        <img src="team-picture.jpeg"
             class="team-photo">

        <div class="project">

            FIRST LEGO League Innovation Project<br><br>

            LEGO SPIKE color sensor → OCR →
            Firebase Realtime Database →
            Live Website Dashboard

        </div>

    </div>

    <div class="right-panel" id="liveColor">

        <div id="colorName">
            Waiting...
        </div>

        <div id="timestamp">
            --
        </div>

        <div class="status">
            🟢 LIVE SENSOR
        </div>

    </div>

</div>

</body>

</html>
