
<!DOCTYPE html>
<html>

<head>
  <title>FLL Color Sensor</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

    const firebaseConfig = {
  apiKey: "AIzaSyDOo74IoJTMqIN3SrxCy84DQqAQQUFFv8U",
  authDomain: "fll-color-display.firebaseapp.com",
  projectId: "fll-color-display",
  storageBucket: "fll-color-display.firebasestorage.app",
  messagingSenderId: "403048053250",
  appId: "1:403048053250:web:fb4f45485c7af6fb2bc51b",
  measurementId: "G-SD05RLLECS"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, "sensor/color"), (snapshot) => {

      let color = snapshot.val();

      document.getElementById("colorName").innerText = color;

      document.body.style.background = color.toLowerCase();
    });
  </script>

  <style>
    body {
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      font-size:60px;
      font-family:Arial;
      transition:all .5s;
    }
  </style>

</head>

<body>

<div id="colorName">
Waiting...
</div>

</body>

</html>
