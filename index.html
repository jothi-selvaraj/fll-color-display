
<!DOCTYPE html>
<html>

<head>
  <title>FLL Color Sensor</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

    const firebaseConfig = {
      // We'll fill these values later
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, "sensor/color"), (snapshot) => {

      let color = snapshot.val();

      document.getElementById("colorName").innerText = color;

      document.body.style.background = color.toLowerCase();
    });
  </script>

  <style>
    body {
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      font-size:60px;
      font-family:Arial;
      transition:all .5s;
    }
  </style>

</head>

<body>

<div id="colorName">
Waiting...
</div>

</body>

</html>
